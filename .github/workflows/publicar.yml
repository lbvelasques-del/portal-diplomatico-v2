name: Publicar Portal Diplomatico V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portal-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extrair projeto
        run: |
          mkdir -p app
          unzip -q Portal_Diplomatico_V2_Alpha1.zip -d app

      - name: Instalar dependencias e testar
        working-directory: app/futebol-diplomatico-v2
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Compilar site
        working-directory: app/futebol-diplomatico-v2
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build -- --base="/${{ github.event.repository.name }}/"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/futebol-diplomatico-v2/dist

      - name: Publicar site
        id: deploy
        uses: actions/deploy-pages@v4
